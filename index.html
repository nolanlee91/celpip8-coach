<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0d3a40" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16292d" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply this device's Sáng/Tối choice before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === "dark" ? "#16292d" : "#0d3a40"; });
        }
      } catch (e) {}
    </script>
    <title>CELPIP 8 Coach</title>
    <link rel="preload" href="/fonts/BeVietnamPro-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/BeVietnamPro-normal-400-vietnamese.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
